<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>GameStore - Tienda de Videojuegos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

    <!-- Cabecera -->
    <header id="inicio">
        <h1>GameStore</h1>
        <p>Tu tienda de videojuegos.</p>
    </header>

    <!-- Barra de navegacion -->
    <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#inicio">GameStore</a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarGameStore"
                aria-controls="navbarGameStore"
                aria-expanded="false"
                aria-label="Mostrar navegacion">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarGameStore">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#inicio">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#productos">Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link categoria-link" href="#productos" data-categoria="Estrategia">Estrategia</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link categoria-link" href="#productos" data-categoria="Simulación">Simulación</a>
                    </li>
                </ul>

                <form id="form-busqueda" class="d-flex mt-3 mt-lg-0" role="search">
                    <label class="visually-hidden" for="buscar-producto">Buscar producto</label>
                    <input
                        class="form-control me-2"
                        type="search"
                        id="buscar-producto"
                        placeholder="Buscar producto"
                        aria-label="Buscar producto">
                    <button class="btn btn-outline-light" type="submit">Buscar</button>
                </form>
            </div>
        </div>
    </nav>

    <!-- Carrusel de productos -->
    <div id="carouselProductos" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="img/lol-portada.jpg" class="d-block w-100 carousel-img" alt="League of Legends">
            </div>

            <div class="carousel-item">
                <img src="img/tennis-portada.jpg" class="d-block w-100 carousel-img" alt="Tennis Manager 25">
            </div>

            <div class="carousel-item">
                <img src="img/rimworld-portada.jpg" class="d-block w-100 carousel-img" alt="RimWorld">
            </div>
        </div>

        <button class="carousel-control-prev" type="button"
            data-bs-target="#carouselProductos"
            data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Anterior</span>
        </button>

        <button class="carousel-control-next" type="button"
            data-bs-target="#carouselProductos"
            data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Siguiente</span>
        </button>
    </div>
    <!-- Productos -->
    <section id="productos" class="container my-5">
        <h2 class="text-center mb-4">Productos</h2>

        <div id="lista-productos" class="row g-4"></div>
    </section>

    <!-- Formulario de contacto -->
    <section id="formulario-contacto" class="container my-5">
        <h2 class="text-center mb-4">Contacto</h2>

        <form id="contactoForm" novalidate>
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" name="nombre">
            </div>

            <div class="mb-3">
                <label for="correo" class="form-label">Correo</label>
                <input type="email" class="form-control" id="correo" name="correo">
            </div>

            <div class="mb-3">
                <label for="mensaje" class="form-label">Mensaje</label>
                <textarea class="form-control" id="mensaje" name="mensaje" rows="4"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
    </section>
    <!-- Pie de pagina -->
    <footer id="contacto">
        <p>Contacto: contacto@gamestore.cl</p>
        <p><a href="https://www.instagram.com/">Instagram</a></p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
